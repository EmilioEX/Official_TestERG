<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Felicidades, Ganaste!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #eafaf1;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(39, 174, 96, 0.15);
            border: 2px solid #2ecc71;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #27ae60;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 30px;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(39, 174, 96, 0.2);
        }

        .btn:hover {
            background-color: #219653;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #34495e;
            box-shadow: 0 4px 6px rgba(52, 73, 94, 0.2);
        }

        .btn-secondary:hover {
            background-color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎉 ¡Ganaste! 🏆</h1>
        <p>¡Excelente trabajo! Has completado exitosamente todas las figuras y colores requeridos en el quiz.</p>
        
        <div class="btn-container">
            <a href="{{ url_for('quiz') }}" class="btn">Jugar de Nuevo</a>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Menú Principal</a>
        </div>
    </div>

</body>
</html>
