<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fin del Juego</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fdedec;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(231, 76, 60, 0.15);
            border: 2px solid #e74c3c;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #c0392b;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 30px;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(231, 76, 60, 0.2);
        }

        .btn:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #34495e;
            box-shadow: 0 4px 6px rgba(52, 73, 94, 0.2);
        }

        .btn-secondary:hover {
            background-color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>❌ Fin del Juego 🎮</h1>
        <p>El quiz ha finalizado o ha sido interrumpido. ¡No te preocupes, puedes intentarlo de nuevo cuando quieras!</p>
        
        <div class="btn-container">
            <a href="{{ url_for('quiz') }}" class="btn">Reintentar Quiz</a>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Menú Principal</a>
        </div>
    </div>
</body>
</html>
