<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>
<body>
    <h2 id="informacion"></h2>
    <script>
        const texto=document.getElementById("informacion");
        function main(){
            setInterval(actualizarEstado, 100);
        }

        async function obtenerEstado() {
            const frame = [
                "./datos1.json",
                "./datos2.json",
                "./datos3.json"
            ];
            const indiceAleatorio = Math.floor(Math.random() * 3);

            const archivo = await fetch(frame[indiceAleatorio]);
            const datos = await archivo.json();

            return datos;
        }

        async function actualizarEstado(){
            const datos = await obtenerEstado();
            texto.textContent =`${datos.figura} - ${datos.color}`;
        }
        main();
    </script>
</body>
</html>
